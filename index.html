<style>
/* Layout: phone-first calendar — sticky header with a 7-day strip, below it one day as a full-width time grid (swipe = next day) or an agenda list; tap a block for a bottom sheet. */
:root {
  --bg: #f6f7f5;
  --surface: #ffffff;
  --fg: #1c2320;
  --muted: #69736d;
  --faint: #a2aaa5;
  --line: #e3e7e3;
  --line-soft: #eef1ee;
  --accent: #2c7a66;
  --accent-fg: #ffffff;
  --accent-soft: #dfeee8;
  --now: #d64b45;
  --scrim: rgba(12, 18, 15, .4);
  --shadow: 0 -6px 30px rgba(20, 30, 25, .16);
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --c0b: hsl(152 42% 88%); --c0f: hsl(152 45% 22%);
  --c1b: hsl(210 70% 91%); --c1f: hsl(210 55% 28%);
  --c2b: hsl(262 60% 92%); --c2f: hsl(262 38% 34%);
  --c3b: hsl(340 65% 92%); --c3f: hsl(340 45% 32%);
  --c4b: hsl(40 80% 87%);  --c4f: hsl(30 60% 26%);
  --c5b: hsl(182 45% 87%); --c5f: hsl(185 55% 22%);
  --c6b: hsl(14 75% 90%);  --c6f: hsl(12 50% 32%);
  --c7b: hsl(228 35% 90%); --c7f: hsl(228 30% 30%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #191e1b; --fg: #e3e8e5; --muted: #929c96; --faint: #5d6661; --line: #2a312d; --line-soft: #1f2522;
    --accent: #74c6ae; --accent-fg: #0e1915; --accent-soft: #1d2f28; --now: #ff7a72; --scrim: rgba(0,0,0,.55); --shadow: 0 -6px 30px rgba(0,0,0,.5);
    --c0b: hsl(152 22% 22%); --c0f: hsl(152 45% 84%);
    --c1b: hsl(210 28% 24%); --c1f: hsl(210 70% 88%);
    --c2b: hsl(262 20% 25%); --c2f: hsl(262 60% 89%);
    --c3b: hsl(340 22% 24%); --c3f: hsl(340 65% 88%);
    --c4b: hsl(36 26% 22%);  --c4f: hsl(40 75% 82%);
    --c5b: hsl(184 24% 21%); --c5f: hsl(182 50% 82%);
    --c6b: hsl(12 24% 23%);  --c6f: hsl(14 75% 87%);
    --c7b: hsl(228 16% 25%); --c7f: hsl(228 40% 88%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #191e1b; --fg: #e3e8e5; --muted: #929c96; --faint: #5d6661; --line: #2a312d; --line-soft: #1f2522;
  --accent: #74c6ae; --accent-fg: #0e1915; --accent-soft: #1d2f28; --now: #ff7a72; --scrim: rgba(0,0,0,.55); --shadow: 0 -6px 30px rgba(0,0,0,.5);
  --c0b: hsl(152 22% 22%); --c0f: hsl(152 45% 84%);
  --c1b: hsl(210 28% 24%); --c1f: hsl(210 70% 88%);
  --c2b: hsl(262 20% 25%); --c2f: hsl(262 60% 89%);
  --c3b: hsl(340 22% 24%); --c3f: hsl(340 65% 88%);
  --c4b: hsl(36 26% 22%);  --c4f: hsl(40 75% 82%);
  --c5b: hsl(184 24% 21%); --c5f: hsl(182 50% 82%);
  --c6b: hsl(12 24% 23%);  --c6f: hsl(14 75% 87%);
  --c7b: hsl(228 16% 25%); --c7f: hsl(228 40% 88%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { color: var(--fg); font: 15px/1.4 var(--font-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.app { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 0 28px; }
.c0 { --eb: var(--c0b); --ef: var(--c0f); } .c1 { --eb: var(--c1b); --ef: var(--c1f); }
.c2 { --eb: var(--c2b); --ef: var(--c2f); } .c3 { --eb: var(--c3b); --ef: var(--c3f); }
.c4 { --eb: var(--c4b); --ef: var(--c4f); } .c5 { --eb: var(--c5b); --ef: var(--c5f); }
.c6 { --eb: var(--c6b); --ef: var(--c6f); } .c7 { --eb: var(--c7b); --ef: var(--c7f); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); margin-inline: -16px; padding: 8px 16px 0; border-bottom: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 4px; min-width: 0; }
.month { display: flex; align-items: center; gap: 4px; font-size: 22px; font-weight: 600; letter-spacing: -.015em; padding: 4px 0; min-width: 0; }
.month span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.month small { font-size: 15px; font-weight: 500; color: var(--muted); }
.month svg { width: 18px; height: 18px; color: var(--muted); flex: none; transition: transform .15s; }
.month[aria-expanded="true"] svg { transform: rotate(180deg); }
.sp { flex: 1; min-width: 0; }
.ib { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); flex: none; }
.ib[aria-pressed="true"] { background: var(--line-soft); color: var(--fg); }
.ib svg { width: 21px; height: 21px; }
.todaybtn { width: 40px; height: 40px; display: grid; place-items: center; flex: none; }
.todaybtn span { width: 28px; height: 28px; border: 1.6px solid var(--muted); border-radius: 7px; display: grid; place-items: center; font-size: 12.5px; font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }

.search { padding: 4px 0 8px; }
.search input { width: 100%; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font: inherit; font-size: 16px; color: var(--fg); }

/* week strip */
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 2px 0 6px; touch-action: pan-y; }
.sd { display: grid; justify-items: center; gap: 2px; padding: 2px 0 4px; min-width: 0; }
.sd .w { font-size: 11px; color: var(--muted); letter-spacing: .03em; }
.sd .n { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.sd .dots { display: flex; gap: 3px; height: 5px; }
.sd .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }
.sd .dots i.m { background: var(--accent); }
.sd.we .n, .sd.we .w { color: var(--faint); }
.sd.tod .n { color: var(--accent); font-weight: 700; }
.sd.tod .w { color: var(--accent); font-weight: 600; }
.sd.sel .n { background: var(--fg); color: var(--bg); font-weight: 600; }
.sd.sel.tod .n { background: var(--accent); color: var(--accent-fg); }

.tabs { display: flex; align-items: center; gap: 8px; padding: 4px 0 10px; }
.seg { display: inline-flex; background: var(--line-soft); border-radius: 10px; padding: 3px; }
.seg button { height: 32px; padding: 0 16px; border-radius: 8px; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.filter { height: 32px; padding: 0 12px; border-radius: 16px; font-size: 13px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.filter i { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid currentColor; display: grid; place-items: center; }
.filter[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 500; }
.filter[aria-pressed="true"] i::after { content: ""; width: 6px; height: 6px; border-radius: 1px; background: currentColor; }

/* mini month */
.mini { padding: 0 0 10px; }
.mini-h { display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 15px; }
.mini-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; row-gap: 2px; }
.mini-g .wd { font-size: 11px; color: var(--faint); padding: 4px 0; }
.mini-g button { position: relative; height: 40px; font-size: 15px; font-variant-numeric: tabular-nums; display: grid; place-items: center; }
.mini-g button b { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 400; }
.mini-g button.out { color: var(--faint); }
.mini-g button.tod b { color: var(--accent); font-weight: 700; }
.mini-g button.sel b { background: var(--fg); color: var(--bg); font-weight: 600; }
.mini-g button.has::after { content: ""; position: absolute; left: 50%; bottom: 1px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }

/* day header */
.dayline { display: flex; align-items: baseline; gap: 8px; padding: 14px 0 8px; min-width: 0; }
.dayline b { font-size: 16px; font-weight: 600; white-space: nowrap; }
.dayline span { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.nowcard { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.nowcard .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--now); flex: none; }
.nowcard .dot.next { background: var(--accent); }
.nowcard div { min-width: 0; display: grid; }
.nowcard b { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nowcard small { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* day grid */
.day { display: grid; grid-template-columns: 46px minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; touch-action: pan-y; }
.gutter { position: relative; }
.gutter span { position: absolute; right: 8px; transform: translateY(-50%); font-size: 11px; color: var(--faint); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.col { position: relative; border-left: 1px solid var(--line-soft); }
.hl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line-soft); pointer-events: none; }
.blk { position: absolute; border-radius: 8px; padding: 6px 8px; overflow: hidden; background: var(--eb); color: var(--ef); text-align: left; line-height: 1.25; border: 1.5px solid var(--surface); display: flex; flex-direction: column; gap: 2px; }
.blk .bt { font-weight: 600; font-size: 14px; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
.blk .bm { font-size: 12px; opacity: .88; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
.blk .bm .tm { font-family: var(--font-mono); font-size: 11.5px; }
.blk.narrow { padding: 5px 6px; }
.blk.narrow .bt { font-size: 12.5px; }
.blk.narrow .bm { font-size: 11px; }
.blk.short { flex-direction: row; align-items: center; gap: 6px; padding-block: 2px; }
.blk.short .bt { -webkit-line-clamp: 1 !important; font-size: 12.5px; }
.blk.short .bm { -webkit-line-clamp: 1; white-space: nowrap; }
.blk.opt { background: var(--surface); border: 1.5px dashed var(--ef); }
.blk.opt .bt { font-weight: 500; }
.blk.x .bt { text-decoration: line-through; }
.blk.past { opacity: .55; }
.nowl { position: absolute; left: -1px; right: 0; height: 2px; background: var(--now); z-index: 3; pointer-events: none; }
.nowl::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }

.free { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px 18px; text-align: center; display: grid; gap: 6px; justify-items: center; }
.free h2 { margin: 0; font-size: 17px; font-weight: 600; }
.free p { margin: 0; color: var(--muted); font-size: 14px; }
.jump { margin-top: 8px; display: grid; gap: 2px; padding: 10px 14px; border-radius: 12px; background: var(--eb); color: var(--ef); text-align: left; max-width: 100%; }
.jump small { font-size: 12px; opacity: .85; }
.jump b { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }

/* agenda */
.ag-month { font-size: 15px; font-weight: 600; padding: 18px 0 6px; }
.ag-day { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px; padding: 8px 0; border-top: 1px solid var(--line-soft); }
.ag-date { text-align: center; }
.ag-date .w { font-size: 11px; color: var(--muted); letter-spacing: .03em; }
.ag-date .n { width: 34px; height: 34px; margin: 1px auto 0; display: grid; place-items: center; border-radius: 50%; font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.ag-day.tod .w { color: var(--accent); font-weight: 600; }
.ag-day.tod .n { background: var(--accent); color: var(--accent-fg); }
.ag-day.past { opacity: .5; }
.ag-list { display: grid; gap: 5px; min-width: 0; }
.chip { display: grid; gap: 2px; text-align: left; padding: 9px 11px; border-radius: 10px; background: var(--eb); color: var(--ef); min-width: 0; border: 1.5px solid transparent; }
.chip.opt { background: transparent; border: 1.5px dashed var(--ef); }
.chip.x .ct { text-decoration: line-through; }
.chip .ct { font-weight: 600; font-size: 14.5px; line-height: 1.3; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
.chip.opt .ct { font-weight: 500; }
.chip .cm { font-size: 12.5px; opacity: .88; overflow-wrap: anywhere; }
.chip .cm .tm { font-family: var(--font-mono); font-size: 12px; }
.more { margin: 14px auto 0; display: block; height: 40px; padding: 0 18px; border-radius: 20px; border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.count { color: var(--muted); font-size: 13px; padding-top: 12px; }

.state { padding: 44px 18px; text-align: center; color: var(--muted); }
.state h2 { font-size: 17px; font-weight: 600; color: var(--fg); margin: 0 0 4px; }
.state p { margin: 0; }

/* bottom sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; margin: 0 auto; width: 100%; max-width: 560px; max-height: 85%; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border-radius: 20px 20px 0 0; padding: 8px 20px calc(22px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow); }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sh-x { position: absolute; top: 8px; right: 8px; }
.sh-top { display: flex; gap: 12px; align-items: flex-start; padding-right: 36px; }
.sh-sw { width: 14px; height: 14px; border-radius: 4px; background: var(--ef); margin-top: 6px; flex: none; }
.sh-t { font-size: 20px; font-weight: 600; line-height: 1.28; flex: 1; min-width: 0; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
.sh-sub { color: var(--muted); margin-top: 3px; font-size: 14.5px; font-weight: 400; }
.sh-rows { display: grid; gap: 12px; margin: 16px 0 0; font-size: 15px; }
.sh-row { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; align-items: start; }
.sh-row svg { width: 18px; height: 18px; color: var(--muted); margin-top: 1px; }
.sh-row div { overflow-wrap: anywhere; }
.sh-desc { white-space: pre-line; font-size: 14px; line-height: 1.5; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.tag { font-size: 12px; padding: 3px 9px; border-radius: 10px; background: var(--line-soft); color: var(--muted); }
.tag.req { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.tag.cx { background: var(--line-soft); color: var(--now); font-weight: 500; }
.sh-act { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 2px 0 4px; }
.sh-act a { display: grid; place-items: center; min-height: 44px; line-height: 1.2; padding-block: 6px; font-size: 14px; font-weight: 500; text-decoration: none; border-radius: 12px; border: 1px solid var(--line); color: var(--fg); text-align: center; padding: 0 8px; }
.sh-act a.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

footer { margin-top: 22px; color: var(--muted); font-size: 12px; line-height: 1.5; display: grid; gap: 10px; }
.export { display: flex; flex-wrap: wrap; gap: 6px; }
.export a { display: inline-flex; align-items: center; height: 34px; border: 1px solid var(--line); border-radius: 17px; padding: 0 12px; font-size: 12.5px; color: var(--fg); text-decoration: none; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; max-width: 420px; background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-size: 13.5px; z-index: 50; text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s cubic-bezier(.2,.8,.3,1); } @keyframes up { from { transform: translateY(40px); opacity: .4; } }
  .scrim { animation: fade .2s ease-out; } @keyframes fade { from { opacity: 0; } }
}
/* Skins chosen in the theme menu (data-skin on <html>); they come after the system/viewer theme blocks so they win. */

}
:root[data-skin="light"] { --bg: #f6f7f5; --surface: #ffffff; --fg: #1c2320; --muted: #69736d; --faint: #a2aaa5; --line: #e3e7e3; --line-soft: #eef1ee; --accent: #2c7a66; --accent-fg: #ffffff; --accent-soft: #dfeee8; --now: #d64b45; }

  function detectLang() {

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  }

  function renderMini(now) {

    for (let i = 0; i < 7; i++) g += `<span class="wd">${wdS(add("2024-01-01", i))}</span>`;

  // ---------- day view ----------
  function nowCard(now) {

    const cur = evs.find(e => e.s <= now), nxt = evs.find(e => e.s > now), e = cur || nxt;
    if (!e) return "";
    const room = e.l?.length ? " · " + esc(e.l[0]) : "";
    return cur
      ? `<button class="nowcard" data-id="${e.i}"><span class="dot"></span><div><b>${esc(e.t)}</b><small>${t("now_until", e.e.slice(11))}${room}</small></div></button>`
      : `<button class="nowcard" data-id="${e.i}"><span class="dot next"></span><div><b>${esc(e.t)}</b><small>${t("in_dur", dur(diffMin(e.s, now), true))} · ${e.s.slice(11)}${room}</small></div></button>`;

  function renderDay(now) {

    const n = evs.length;
    let html = `<div class="dayline"><b>${esc(dayLong(day))}</b><span>${n ? cnt(n, "classes") + " · " : ""}${t("wk")} ${isoWeek(day)}</span></div>`;
    html += nowCard(now);
    if (!n) {

      html += `<div class="free"><h2>${day < today ? t("free_past") : t("free_day")}</h2><p>${S.onlyMand ? t("free_mand") : t("free_none")}</p>${nxt ? `<button class="jump ${colorOf(nxt.t)}" data-goto="${nxt.s.slice(0, 10)}"><small>${t("next_lbl")} ${esc(dayShort(nxt.s.slice(0, 10)))} · ${nxt.s.slice(11)}</small><b>${esc(nxt.t)}</b></button>` : ""}</div>`;
      $("main").innerHTML = html;
      return;
    }
    let h0 = Math.min(...evs.map(e => Math.floor(mins(e.s) / 60)));
    let h1 = Math.max(...evs.map(e => e.e.slice(0, 10) > day ? 24 : Math.ceil(mins(e.e) / 60)));
    if (day === today) { const nh = mins(now) / 60; if (nh < h0 && nh >= h0 - 2) h0 = Math.floor(nh); if (nh > h1 && nh <= h1 + 2) h1 = Math.ceil(nh); }
    if (h1 - h0 < 4) { h1 = Math.min(24, h0 + 4); }
    const HOUR = 64, PAD = 12, H = (h1 - h0) * HOUR + PAD * 2;
    let gut = "", lines = "", blocks = "";
    for (let h = h0; h <= h1; h++) {
      gut += `<span style="top:${(h - h0) * HOUR + PAD}px">${String(h).padStart(2, "0")}:00</span>`;
      lines += `<div class="hl" style="top:${(h - h0) * HOUR + PAD}px"></div>`;
    }
    for (const { e, c, n: cols } of layout(evs)) {
      const endM = e.e.slice(0, 10) > day ? 1440 : mins(e.e);
      const top = (mins(e.s) - h0 * 60) / 60 * HOUR + PAD;
      const ht = Math.max(26, (endM - mins(e.s)) / 60 * HOUR);
      const w = 100 / cols;
      const short = ht < 44, narrow = cols >= 3;
      const lineH = narrow ? 16 : 18;
      const metaLines = short ? 0 : (ht > 84 ? 2 : 1);
      const clamp = short ? 1 : Math.max(1, Math.floor((ht - 12 - metaLines * 15) / lineH));
      const cls = ["blk", colorOf(e.t), e.m ? "" : "opt", e.x ? "x" : "", e.e <= now ? "past" : "", short ? "short" : "", narrow ? "narrow" : ""].join(" ");
      const meta = short ? `<span class="bm"><span class="tm">${e.s.slice(11)}</span></span>` :
        `<span class="bm"><span class="tm">${e.s.slice(11)}–${e.e.slice(11)}</span>${e.l?.length ? " · " + esc(e.l.join(", ")) : ""}${e.n > 1 ? " · " + cnt(e.n, "slots") : ""}</span>`;
      blocks += `<button class="${cls}" data-id="${e.i}" style="top:${top}px;height:${ht}px;left:calc(${c * w}% + 3px);width:calc(${w}% - 6px)"><span class="bt" lang="de" style="-webkit-line-clamp:${clamp}">${esc(e.t)}</span>${meta}</button>`;
    }
    let nowl = "";
    if (day === today) { const nm = mins(now); if (nm >= h0 * 60 && nm <= h1 * 60) nowl = `<div class="nowl" style="top:${(nm - h0 * 60) / 60 * HOUR + PAD}px"></div>`; }
    html += `<div class="day" id="daygrid"><div class="gutter" style="height:${H}px">${gut}</div><div class="col" style="height:${H}px">${lines}${blocks}${nowl}</div></div>`;
    $("main").innerHTML = html;
  }

  // ---------- list / search ----------
  function chip(e) {

  function agenda(list, now, limit) {
    const today = now.slice(0, 10), groups = new Map();

    const sd = ev.target.closest(".sd[data-day]"); if (sd) { selectDay(sd.dataset.day); return; }
    const g = ev.target.closest("[data-goto]"); if (g) { selectDay(g.dataset.goto); scrollTo({ top: 0 }); return; }
    if (ev.target.id === "more") { S.listLimit += 40; render(); }
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { if ($("sheet-root").innerHTML) closeSheet(); return; }
    if (ev.target.tagName === "INPUT" || $("sheet-root").innerHTML || S.view !== "day" || S.query) return;
    if (ev.key === "ArrowLeft") selectDay(add(S.sel, -1));
    if (ev.key === "ArrowRight") selectDay(add(S.sel, 1));
  });
  // swipe: on the week strip = whole week, on the day = one day
  function swipe(el, fn) {
    let x0 = null, y0 = 0;
    el.addEventListener("touchstart", (ev) => { const t = ev.touches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive: true });
    el.addEventListener("touchend", (ev) => {
      if (x0 === null) return;
      const t = ev.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) fn(dx < 0 ? 1 : -1);
    }, { passive: true });
  }
  swipe($("strip"), (dir) => selectDay(add(S.sel, dir * 7)));
  swipe($("main"), (dir) => { if (S.view === "day" && !S.query) selectDay(add(S.sel, dir)); });
  $("gc-sub").href = "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(new URL("Filmakademie-alle.ics", location.href).href.replace(/^https?:/, "webcal:"));

  S.sel = nowStr().slice(0, 10);
  applyStatic();
  render();
  setInterval(() => { if (!$("sheet-root").innerHTML) render(); }, 60_000);

  // ---------- data (./data.json, written by the GitHub Action) ----------
  let first = true, lastHash = null;
  async function load() {
    try {
      const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      if (d.hash !== lastHash || d.checkedAt !== S.data?.checkedAt) { lastHash = d.hash; S.data = d; if (!$("sheet-root").innerHTML) render(); }
      if (first) { first = false; scrollToNow(); }
    } catch (err) {
      if (!S.data) { S.failed = true; render(); }
    }
  }
  load();
  setInterval(load, 10 * 60_000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
})();
</script>
